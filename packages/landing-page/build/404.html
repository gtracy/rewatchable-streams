<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>404 - Page Not Found | Watch That Pod</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #121212;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background-color: #1e1e1e;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 40px 32px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .code {
        margin: 0 0 8px 0;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
        color: #90caf9;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 1.5rem;
        font-weight: 600;
        color: #ffffff;
      }
      p {
        margin: 0 0 28px 0;
        font-size: 1rem;
        line-height: 1.5;
        color: #b0b0b0;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background-color: #90caf9;
        color: #121212;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        transition: background-color 0.2s ease, transform 0.15s ease;
      }
      .btn:hover {
        background-color: #bbdefb;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code" aria-hidden="true">404</p>
      <h1>Page Not Found</h1>
      <p>
        We couldn&rsquo;t find that page on Watch That Pod. Head back to browse
        The Rewatchables podcast episodes and movie streaming options.
      </p>
      <a class="btn" href="https://watchthatpod.com/">Back to Watch That Pod</a>
    </main>
  </body>
</html>
